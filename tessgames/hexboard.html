<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beach!!!</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="dTest0">
    <h1>Hexagonal Board (side 4)</h1>
    <div id="status" class="status">Building&hellip;</div>
    <div id="board"></div>
    <footer>Board built by clipping a <code>HexTessagon</code> patch from <code>alibs/tess.js</code> &mdash; hexagons
      outside the hexagon <code>max(|q|,|r|,|q+r|) &le; 3</code> are discarded.</footer>
  </div>

  <div id="dTest1">
    <h2>Any tessagon: streets &amp; cities</h2>
    <div class="controls">
      <label for="tessagon">Tessagon</label>
      <select id="tessagon"></select>
      <label for="tcols">Cols</label>
      <input id="tcols" type="number" value="1" min="1" max="12" />
      <label for="trows">Rows</label>
      <input id="trows" type="number" value="1" min="1" max="12" />
      <label for="tpattern">Pattern</label>
      <select id="tpattern"></select>
      <button id="trender">Render</button>
    </div>
    <div class="controls">
      <label><input type="checkbox" id="lblCells" checked /> cells</label>
      <label><input type="checkbox" id="lblStreets" checked /> streets</label>
      <label><input type="checkbox" id="lblCities" checked /> cities</label>
      <label><input type="checkbox" id="lblIsolated" /> isolated cities</label>
    </div>
    <div id="tstatus" class="status"></div>
    <div id="tboard"></div>
  </div>

  <script src="../alibs/yaml.min.js"></script>
  <script src="../tessgames/tess.js"></script>
  <script src="../tessgames/globals.js"></script>
  <script src="../tessgames/codeall.js"></script>
  <script src="../tessgames/hexboard.js"></script>
  <script src="../tessgames/start.js"></script>
</body>

</html>
