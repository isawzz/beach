<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hex Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <h1>Hex Tic-Tac-Toe</h1>
  <div id="status" class="status">X to move</div>
  <div class="controls">
    <label for="size">Board</label>
    <select id="size">
      <option value="3">3 &times; 3 tiles (13 cells)</option>
      <option value="4" selected>4 &times; 4 tiles (25 cells)</option>
      <option value="5">5 &times; 5 tiles (41 cells)</option>
    </select>
    <button id="restart">Restart</button>
  </div>
  <div id="board"></div>
  <footer>Board built as a <code>HexTessagon</code> with <code>alibs/tess.js</code> &mdash; place 3 in a row to win.</footer>

  <script src="../alibs/tess.js"></script>
  <script src="../tessgames/ttt.js"></script>
</body>

</html>
