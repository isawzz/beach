<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flying butterfly silhouette</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--muted:#6b6b70;--card:#f0f3fa}
@media (prefers-color-scheme:dark){:root{--bg:#18181b;--fg:#ececf0;--muted:#9a9aa3;--card:#222a3a}}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px}
#stage{width:min(92vw,520px);background:var(--card);border-radius:14px}
#film{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
#film svg{width:80px;height:70px;background:var(--card);border-radius:8px}
.row{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:13px}
button{font:inherit;padding:4px 12px;border-radius:8px;border:1px solid var(--muted);background:none;color:var(--fg);cursor:pointer}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 500 420"></svg>
<div class="row">
  <label>flaps per second <input id="speed" type="range" min="1" max="6" step="0.5" value="2.5"> <output id="speedO">2.5</output></label>
  <button id="pause">Pause</button>
</div>
<div id="film"></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const BUTTERFLY = [[250,53],[259,54],[261,61],[235,72],[223,102],[219,136],[228,142],[232,156],[237,155],[272,112],[308,87],[358,66],[372,66],[379,75],[379,96],[357,189],[345,206],[320,219],[320,224],[349,250],[353,276],[345,295],[330,312],[310,325],[296,328],[275,321],[256,289],[250,288],[253,328],[250,333],[239,321],[229,285],[223,285],[220,324],[211,340],[192,347],[163,344],[136,333],[121,314],[119,291],[133,261],[103,262],[81,249],[28,166],[21,136],[27,130],[43,126],[79,127],[128,141],[185,166],[184,151],[189,139],[165,99],[146,84],[126,88],[118,84],[116,78],[136,73],[155,80],[174,98],[196,135],[210,134],[222,78],[237,60]];

const smooth = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };

/**
 * butterflyFrames(points, options) -> { frames: [[x,y]...][], bob: number[] }
 * One full wing-beat as `frames` intermediate polygons (frame 0 = wings fully
 * open = your original shape). Wings are squeezed toward the body axis and
 * their tips lift as they close; the antennae flutter; `bob` is the body's
 * vertical offset per frame.
 */
function butterflyFrames(pts, o = {}) {
  const {
    frames = 12, minWing = 0.4, lift = 0.12, bodyHalf = 20, ramp = 25, flutter = 4,
    axis = y => 208 + (y - 135) * 0.15,              // slightly tilted body axis
    antennaBox = { x0: 110, x1: 262, y1: 140 },       // antennae are not flapped
    head = [208, 138],
  } = o;
  const out = [], bob = [];
  for (let f = 0; f < frames; f++) {
    const t = f / frames, open = (1 + Math.cos(2 * Math.PI * t)) / 2;
    const s = minWing + (1 - minWing) * open, ph = 2 * Math.PI * t;
    out.push(pts.map(([x, y]) => {
      if (x >= antennaBox.x0 && x <= antennaBox.x1 && y <= antennaBox.y1) {
        const dist = Math.hypot(x - head[0], y - head[1]), amp = flutter * Math.pow(dist / 90, 1.5);
        return [x + amp * Math.sin(ph + dist * 0.04), y + amp * 0.5 * Math.cos(ph)];
      }
      const cx = axis(y), d = x - cx, w = smooth(bodyHalf, bodyHalf + ramp, Math.abs(d));
      return [cx + d * (1 + (s - 1) * w), y - (1 - s) * w * Math.abs(d) * lift];
    }));
    bob.push(-8 * (1 - open));
  }
  return { frames: out, bob };
}

const str = p => p.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
const mk = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};

const { frames, bob } = butterflyFrames(BUTTERFLY);
const closed = frames.concat([frames[0]]);            // loop back to frame 0
const dur = hz => (1 / hz).toFixed(3) + 's';

// ---- main animation ---------------------------------------------------------
const svg = document.getElementById('stage');
const defs = mk('defs', {}, svg);
const grad = mk('linearGradient', { id: 'g', x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
mk('stop', { offset: 0, 'stop-color': '#ffb347' }, grad);
mk('stop', { offset: 1, 'stop-color': '#e2552d' }, grad);

// drift: a slow figure eight (outer group), sway (middle), body bob (inner), shape
const drift = mk('g', {}, svg);
const sway = mk('g', {}, drift);
const bobG = mk('g', {}, sway);
const poly = mk('polygon', { points: str(frames[0]), fill: 'url(#g)', stroke: '#6b2a10', 'stroke-width': 2, 'stroke-linejoin': 'round' }, bobG);
// the shape is ~360 wide; scale it into the 500x420 stage
drift.setAttribute('transform', 'translate(125,60) scale(0.7)');

const eight = Array.from({ length: 41 }, (_, i) => {
  const t = i / 40 * 2 * Math.PI; return `${(70 * Math.sin(t)).toFixed(1)},${(30 * Math.sin(2 * t)).toFixed(1)}`;
}).join(';');
const outer = mk('g', {}, svg);                       // holds drift motion
outer.appendChild(drift);
mk('animateTransform', { attributeName: 'transform', type: 'translate', values: eight, dur: '12s', repeatCount: 'indefinite' }, outer);

mk('animateTransform', { attributeName: 'transform', type: 'rotate', values: '-5 200 200;5 200 200;-5 200 200', dur: '3s', repeatCount: 'indefinite', calcMode: 'spline', keyTimes: '0;0.5;1', keySplines: '.4 0 .6 1;.4 0 .6 1' }, sway);
const aBob = mk('animateTransform', { attributeName: 'transform', type: 'translate', values: bob.concat([bob[0]]).map(v => `0,${v}`).join(';'), dur: dur(2.5), repeatCount: 'indefinite' }, bobG);
const aPts = mk('animate', { attributeName: 'points', values: closed.map(str).join(';'), dur: dur(2.5), repeatCount: 'indefinite' }, poly);

// ---- filmstrip of the intermediate polygons --------------------------------
const film = document.getElementById('film');
[0, 2, 4, 6, 8, 10].forEach(i => {
  const s = mk('svg', { viewBox: '0 20 400 360' }, film);
  mk('polygon', { points: str(frames[i]), fill: '#e2552d', stroke: '#6b2a10', 'stroke-width': 3 }, s);
});

// ---- controls ---------------------------------------------------------------
const speed = document.getElementById('speed');
speed.oninput = () => {
  document.getElementById('speedO').textContent = speed.value;
  aPts.setAttribute('dur', dur(+speed.value)); aBob.setAttribute('dur', dur(+speed.value));
};
let paused = false;
document.getElementById('pause').onclick = e => {
  paused = !paused; paused ? svg.pauseAnimations() : svg.unpauseAnimations();
  e.target.textContent = paused ? 'Play' : 'Pause';
};
</script>
</body>
</html>
