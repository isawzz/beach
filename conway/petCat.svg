
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="240" height="280">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9C18B"/>
      <stop offset="48%" stop-color="#D8A56D"/>
      <stop offset="100%" stop-color="#B97845"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#D8A56D"/>
      <stop offset="100%" stop-color="#B97845"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5"
        flood-color="#75482F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="60" cy="129" rx="31" ry="5" fill="#75482F" opacity="0.14"/>

  <g filter="url(#shadow)" stroke="#75482F" stroke-width="1.5" stroke-linejoin="round">
    <!-- Feet -->
    <ellipse cx="43" cy="119" rx="13" ry="10" fill="#B97845"/>
    <ellipse cx="77" cy="119" rx="13" ry="10" fill="#B97845"/>

    <!-- Ears -->
    <path d="M27 43 L25 12 Q25 7 30 11 L49 29 Z"
      fill="url(#ear)"/>
    <path d="M71 29 L90 11 Q95 7 95 12 L93 43 Z"
      fill="url(#ear)"/>

    <!-- Main body and head -->
    <path d="M23 49
      C23 31 38 23 60 23
      C82 23 97 31 97 49
      L97 91
      C97 108 82 119 60 119
      C38 119 23 108 23 91 Z"
      fill="url(#wood)"/>

    <!-- Wood grain -->
    <g fill="none" stroke="#A66C3F" stroke-width="1.2"
       stroke-linecap="round" opacity="0.55">
      <path d="M35 47 Q42 43 48 47"/>
      <path d="M72 39 Q80 36 85 41"/>
      <path d="M32 77 Q38 73 43 77"/>
      <path d="M75 94 Q81 89 87 93"/>
    </g>

    <!-- Face -->
    <g stroke="none" fill="#4A3024">
      <ellipse cx="45" cy="64" rx="3.2" ry="4.2"/>
      <ellipse cx="75" cy="64" rx="3.2" ry="4.2"/>
      <path d="M55 74 Q60 70 65 74 Q60 81 55 74 Z"/>
    </g>

    <!-- Smile -->
    <path d="M51 80 Q60 88 69 80"
      fill="none" stroke="#75482F" stroke-width="1.8"
      stroke-linecap="round"/>

    <!-- Cheeks -->
    <ellipse cx="37" cy="76" rx="5" ry="3"
      fill="#F28B72" opacity="0.55" stroke="none"/>
    <ellipse cx="83" cy="76" rx="5" ry="3"
      fill="#F28B72" opacity="0.55" stroke="none"/>

    <!-- Forehead highlight -->
    <path d="M43 35 Q53 30 62 32"
      fill="none" stroke="#FFF0D5" stroke-width="2.5"
      stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
